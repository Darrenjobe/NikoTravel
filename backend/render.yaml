# Render blueprint — one web service with a persistent disk, plus three cron
# jobs that curl the job endpoints. Times are UTC (Greece is UTC+3 in Sept).
services:
  - type: web
    name: niko-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    region: frankfurt
    plan: standard
    healthCheckPath: /healthz
    disk:
      name: niko-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: API_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: TRIP_YEAR
        value: "2026"

  - type: cron
    name: niko-morning
    runtime: image
    image:
      url: docker.io/curlimages/curl:latest
    schedule: "0 4 * * *" # 07:00 Athens
    dockerCommand: >-
      curl -fsS -X POST -H "Authorization: Bearer $API_TOKEN"
      https://niko-backend.onrender.com/api/jobs/morning
    envVars:
      - key: API_TOKEN
        sync: false

  - type: cron
    name: niko-evening
    runtime: image
    image:
      url: docker.io/curlimages/curl:latest
    schedule: "0 17 * * *" # 20:00 Athens
    dockerCommand: >-
      curl -fsS -X POST -H "Authorization: Bearer $API_TOKEN"
      https://niko-backend.onrender.com/api/jobs/evening
    envVars:
      - key: API_TOKEN
        sync: false

  - type: cron
    name: niko-insights
    runtime: image
    image:
      url: docker.io/curlimages/curl:latest
    schedule: "0 11,20 * * *" # 14:00 + 23:00 Athens
    dockerCommand: >-
      curl -fsS -X POST -H "Authorization: Bearer $API_TOKEN"
      https://niko-backend.onrender.com/api/jobs/insights
    envVars:
      - key: API_TOKEN
        sync: false
